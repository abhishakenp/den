name: CI

# main: every push and PR. ci/**: scratch branches pushed by scripts/ci-check.sh (remote build
# mode, docs/dev.md). workflow_dispatch: same build and tests, plus the snapshot job on request.
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshots:
        description: Also render the UI snapshot scenarios (scripts/snapshots.sh) and upload the PNGs
        type: boolean
        default: false
      snapshot_appearance:
        description: Snapshot appearance (dark renders every scenario as <name>-dark.png)
        type: choice
        options: [dark, all]
        default: dark
      lldb:
        description: Run the test bundle under lldb and print all native backtraces on a crash
        type: boolean
        default: false
      pip:
        description: Also run the picture-in-picture scenario in a visible den (system PiP window, full-screen video and a real Space switch)
        type: boolean
        default: false

permissions:
  contents: read

# One run per ref: a newer push (or dispatch) to a ci/** or PR branch cancels the superseded run.
# main queues instead, so every commit on main gets a verdict (and a den.app artifact).
concurrency:
  # Every main commit gets its own run (releases and the updater gate on CI for that exact
  # commit); ci/** scratch branches share one group so superseded runs cancel.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DEN_SIGN_IDENTITY: "-" # ad hoc: runners have no stable signing identity
  DEN_CI: "1"

jobs:
  build-test:
    name: Build, test, perf (macOS 26, arm64)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # bundle.sh derives CFBundleVersion / DenHostAPI from commit counts

      - name: Set up Xcode 26, swift.org toolchain, caches
        id: setup
        uses: ./.github/actions/setup

      - name: swift build
        run: swift build

      - name: Bundle den.app (ad hoc signed, Embedded Swift plugins)
        run: |
          scripts/bundle.sh
          ls -l build/den.app/Contents/PlugIns
          codesign -dv build/den.app 2>&1 | grep -E 'Identifier|Signature'

      # Saved before the tests, so a red test run still keeps the build products.
      - name: Save SwiftPM cache
        if: steps.setup.outputs.spm-cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.setup.outputs.spm-cache-key }}

      - name: Test (scripts/test.sh, UI suites included)
        env:
          CI_TEST_CMD: scripts/ci/repeat-media.sh
        run: scripts/ci/run-tests.sh

      - name: Perf (report only)
        continue-on-error: true
        env:
          PERF_RUNS: 5
          PERF_QUIET_WAIT: 60
          PERF_REPORT: docs/perf/ci-report.md
        run: |
          scripts/perf.sh --report-only 2>&1 | tee docs/perf/ci-perf.log
          {
            echo "### Perf (report only; budgets were calibrated on an M3)"
            cat docs/perf/ci-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p build/ci-logs/crashes
          sleep 10 # ReportCrash writes .ips files asynchronously
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$d" -newer Package.swift \( -name '*.ips' -o -name '*.crash' \) \
              -exec cp {} build/ci-logs/crashes/ \; 2>/dev/null || true
          done
          ls -l build/ci-logs/crashes

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/ci-logs
            build/**/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf
          path: docs/perf
          if-no-files-found: ignore
          retention-days: 14

      # A dev build per green main commit (ad hoc signed, not Sparkle-signed): see docs/dev.md.
      - name: Package den.app
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ditto -c -k --sequesterRsrc --keepParent build/den.app "den-${GITHUB_SHA::12}.zip"

      - name: Upload den.app
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: den-app
          path: den-*.zip
          retention-days: 14

  pip:
    name: Picture in picture scenario (macOS 26, arm64)
    if: github.event_name == 'workflow_dispatch' && inputs.pip
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Xcode 26, swift.org toolchain, caches
        uses: ./.github/actions/setup

      - name: Bundle den.app (with the Scenarios trait)
        run: DEN_SCENARIOS=1 scripts/bundle.sh

      # Another app to switch to (scripts/ci/pip-cover.swift): one covering den, one in full screen.
      - name: Build PipCover.app
        run: |
          app=build/PipCover.app/Contents
          mkdir -p "$app/MacOS"
          xcrun swiftc -swift-version 5 -O scripts/ci/pip-cover.swift -o "$app/MacOS/PipCover"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string io.github.abhishakenp.pipcover' -c 'Add :CFBundleExecutable string PipCover' \
            -c 'Add :CFBundlePackageType string APPL' -c 'Add :CFBundleName string PipCover' "$app/Info.plist"
          codesign --force --sign - build/PipCover.app

      # MediaScenarios `pip`: WebKit's native PiP through every trigger (tab switch, minimize,
      # hide, order out, switching to Terminal / a covering app / a full-screen app's Space), the
      # PiP window's buttons, (DEN_PIP_FULLSCREEN) a full-screen video whose Space is switched away
      # from, and (DEN_PIP_YOUTUBE) a real YouTube page. A visible den on the runner's own display;
      # one line per check plus den's own `media.log` decisions, exit 0 only when all pass.
      - name: Run --scenario pip
        env:
          DEN_PIP_FULLSCREEN: "1"
          DEN_PIP_YOUTUBE: https://www.youtube.com/watch?v=aqz-KE-bpKQ
          DEN_PIP_MSE: https://reference.dashif.org/dash.js/latest/samples/getting-started/auto-load-single-video.html
        run: |
          mkdir -p build/ci-logs
          store=$(mktemp -d)
          export DEN_PIP_COVER="$PWD/build/PipCover.app"
          set +e
          perl -e 'alarm 600; exec @ARGV' build/den.app/Contents/MacOS/den --no-den-home --storage "$store" --scenario pip > build/ci-logs/pip-scenario.log 2>&1
          rc=$?
          set -e
          grep -E "scenario\.|media\.log" build/ci-logs/pip-scenario.log | tee -a "$GITHUB_STEP_SUMMARY"
          cp "${TMPDIR:-/tmp}"/den-pip-*.png build/ci-logs/ 2>/dev/null || true
          exit $rc

      - name: Upload PiP logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-scenario
          path: build/ci-logs
          if-no-files-found: ignore
          retention-days: 14

  snapshots:
    name: UI snapshots (macOS 26, arm64)

    if: github.event_name == 'workflow_dispatch' && inputs.snapshots
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Xcode 26, swift.org toolchain, caches
        uses: ./.github/actions/setup

      - name: Bundle den.app (with the Scenarios trait)
        run: DEN_SCENARIOS=1 scripts/bundle.sh

      - name: Render snapshot scenarios (scripts/snapshots.sh)
        env:
          SNAPSHOT_APPEARANCE: ${{ inputs.snapshot_appearance == 'all' && '' || 'dark' }}
          # The runner has a GUI session: native menus and the docked Web Inspector render too.
          MENUS: "1"
        run: |
          touch "$RUNNER_TEMP/snapshots.start"
          # Straight to the log (no pipe: a den left running by a --stay capture would hold it open).
          scripts/snapshots.sh

      - name: Collect snapshots
        if: always()
        env:
          SNAPSHOT_APPEARANCE: ${{ inputs.snapshot_appearance == 'all' && '' || 'dark' }}
        run: |
          pkill -x den || true
          mkdir -p build/snapshots
          find docs/screenshots -name '*.png' -newer "$RUNNER_TEMP/snapshots.start" -exec cp {} build/snapshots/ \;
          count=$(find build/snapshots -name '*.png' | wc -l | tr -d ' ')
          {
            echo "### Snapshots (${SNAPSHOT_APPEARANCE:-light and dark}): $count PNGs"
            echo "Artifact \`snapshots\`: copy them into docs/screenshots/ and commit."
            find build/snapshots -name '*.png' -exec basename {} \; | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: build/snapshots/*.png
          if-no-files-found: ignore
          retention-days: 14
