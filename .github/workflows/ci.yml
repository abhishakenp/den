name: CI

# main: every push and PR. ci/**: scratch branches pushed by scripts/ci-check.sh (remote build
# mode, docs/dev.md). workflow_dispatch: same build and tests, plus the snapshot job on request.
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshots:
        description: Also render the UI snapshot scenarios (scripts/snapshots.sh) and upload the PNGs
        type: boolean
        default: false
      snapshot_appearance:
        description: Snapshot appearance (dark renders every scenario as <name>-dark.png)
        type: choice
        options: [dark, all]
        default: dark
      lldb:
        description: Run the test bundle under lldb and print all native backtraces on a crash
        type: boolean
        default: false
      test_parallelism:
        description: Maximum tests running at once (Swift Testing parallelization width)
        type: string
        default: "1"

permissions:
  contents: read

# One run per ref: a newer push (or dispatch) to the same branch cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEN_SIGN_IDENTITY: "-" # ad hoc: runners have no stable signing identity
  DEN_CI: "1"

jobs:
  build-test:
    name: Build, test, perf (macOS 26, arm64)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # bundle.sh derives CFBundleVersion / DenHostAPI from commit counts

      - name: Set up Xcode 26, swift.org toolchain, caches
        id: setup
        uses: ./.github/actions/setup

      - name: swift build
        run: swift build

      - name: Bundle den.app (ad hoc signed, Embedded Swift plugins)
        run: |
          scripts/bundle.sh
          ls -l build/den.app/Contents/PlugIns
          codesign -dv build/den.app 2>&1 | grep -E 'Identifier|Signature'

      # Saved before the tests, so a red test run still keeps the build products.
      - name: Save SwiftPM cache
        if: steps.setup.outputs.spm-cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.setup.outputs.spm-cache-key }}

      - name: Test (scripts/test.sh, UI suites included)
        env:
          # The suites' wall-clock timeouts were set on an 8-core M3. On the 3-core runner, running
          # suites side by side missed them and was slower overall (measured: width 1 = 324 s,
          # unlimited = 380-410 s). Swift Testing's parallelization width; the input overrides it.
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: ${{ inputs.test_parallelism || '1' }}
          CI_TEST_CMD: ${{ inputs.lldb && 'scripts/ci/lldb-tests.sh' || 'scripts/test.sh' }}
        run: scripts/ci/run-tests.sh

      - name: Perf (report only)
        continue-on-error: true
        env:
          PERF_RUNS: 5
          PERF_QUIET_WAIT: 60
          PERF_REPORT: docs/perf/ci-report.md
        run: |
          scripts/perf.sh --report-only 2>&1 | tee docs/perf/ci-perf.log
          {
            echo "### Perf (report only; budgets were calibrated on an M3)"
            cat docs/perf/ci-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p build/ci-logs/crashes
          sleep 10 # ReportCrash writes .ips files asynchronously
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$d" -newer Package.swift \( -name '*.ips' -o -name '*.crash' \) \
              -exec cp {} build/ci-logs/crashes/ \; 2>/dev/null || true
          done
          ls -l build/ci-logs/crashes

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/ci-logs
            build/**/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf
          path: docs/perf
          if-no-files-found: ignore
          retention-days: 14

      # A dev build per green main commit (ad hoc signed, not Sparkle-signed): see docs/dev.md.
      - name: Package den.app
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ditto -c -k --sequesterRsrc --keepParent build/den.app "den-${GITHUB_SHA::12}.zip"

      - name: Upload den.app
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: den-app
          path: den-*.zip
          retention-days: 14

  snapshots:
    name: UI snapshots (macOS 26, arm64)
    if: github.event_name == 'workflow_dispatch' && inputs.snapshots
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Xcode 26, swift.org toolchain, caches
        uses: ./.github/actions/setup

      - name: Bundle den.app
        run: scripts/bundle.sh

      - name: Render snapshot scenarios (scripts/snapshots.sh)
        env:
          SNAPSHOT_APPEARANCE: ${{ inputs.snapshot_appearance == 'all' && '' || 'dark' }}
        run: |
          mkdir -p build/ci-logs build/snapshots
          touch build/snapshots/.start
          # To a file, not a pipe: a den left running by a --stay capture would hold a pipe open.
          rc=0
          scripts/snapshots.sh > build/ci-logs/snapshots.log 2>&1 || rc=$?
          pkill -x den || true
          cat build/ci-logs/snapshots.log
          find docs/screenshots -name '*.png' -newer build/snapshots/.start -exec cp {} build/snapshots/ \;
          count=$(find build/snapshots -name '*.png' | wc -l | tr -d ' ')
          {
            echo "### Snapshots (${SNAPSHOT_APPEARANCE:-light and dark}): $count PNGs, exit $rc"
            echo "Artifact \`snapshots\`; commit them into docs/screenshots/."
            find build/snapshots -name '*.png' -exec basename {} \; | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: |
            build/snapshots/*.png
            build/ci-logs
          if-no-files-found: ignore
          retention-days: 14
